<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Friend 💖</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div id="floatingHearts"></div>

    <main class="container">

        <!-- =========================
             CREATOR
        ========================== -->

        <section
            class="card"
            id="creatorPage"
        >

            <div class="emoji">🥺💗</div>

            <h1>Say Sorry 💌</h1>

            <p>
                Sometimes a simple "sorry" isn't enough...
                So make it a little more special. 🌸
            </p>

            <form id="apologyForm">

                <div class="form-group">

                    <label for="sender">
                        Your Name
                    </label>

                    <input
                        id="sender"
                        type="text"
                        placeholder="Enter your name"
                        maxlength="100"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="receiver">
                        Friend's Name
                    </label>

                    <input
                        id="receiver"
                        type="text"
                        placeholder="Enter your friend's name"
                        maxlength="100"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="message">
                        Your Apology
                    </label>

                    <textarea
                        id="message"
                        placeholder="Write what you want to say..."
                        maxlength="5000"
                        required
                    ></textarea>

                </div>


                <button
                    class="btn primary"
                    id="createButton"
                    type="submit"
                >
                    Create Apology Link 💌
                </button>

            </form>


            <div
                class="link-box"
                id="linkBox"
            >

                <h3>
                    Your apology is ready! 💖
                </h3>

                <p>
                    Copy this link and send it to your friend.
                </p>

                <div class="link-input">

                    <input
                        id="generatedLink"
                        type="text"
                        readonly
                    >

                    <button
                        class="btn primary"
                        id="copyButton"
                        type="button"
                    >
                        Copy
                    </button>

                </div>

                <p id="copyMessage"></p>

            </div>


            <p
                class="error"
                id="creatorError"
            ></p>

        </section>


        <!-- =========================
             RECEIVER
        ========================== -->

        <section
            class="card"
            id="receiverPage"
            style="display:none;"
        >

            <div id="apologyScreen">

                <div
                    class="emoji"
                    id="mainEmoji"
                >
                    🥺
                </div>


                <h1 id="receiverTitle">
                    Hey...
                </h1>


                <p id="introText"></p>


                <div class="message-box">

                    <p id="apologyMessage"></p>

                </div>


                <p id="question">
                    Will you forgive me? 🥺
                </p>


                <div class="buttons">

                    <button
                        class="btn forgive"
                        id="forgiveButton"
                    >
                        I forgive you 💖
                    </button>


                    <button
                        class="btn reject"
                        id="rejectButton"
                    >
                        I don't forgive you 😤
                    </button>

                </div>


                <div
                    class="response"
                    id="response"
                ></div>

            </div>


            <!-- =========================
                 SUCCESS
            ========================== -->

            <div
                class="success"
                id="successScreen"
            >

                <div class="emoji">
                    🥹💖
                </div>

                <h1>
                    YAYYYYY! 🎉
                </h1>

                <h2>
                    Friendship restored!
                </h2>

                <p id="successText"></p>

                <p>
                    No more fighting, okay? 🤝💕
                </p>

            </div>


            <div
                class="error"
                id="receiverError"
            ></div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
